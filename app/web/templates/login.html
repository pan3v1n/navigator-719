{% extends "base.html" %}
{% block title %}Вход — {{ app_title }}{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">719</div>
    <h1>{{ app_title }}</h1>
    <p class="sub">Ассистент эксперта по ПП №719 · {{ org }}</p>
    <form class="login-form" method="post" action="/login">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <input name="username" placeholder="Логин" autocomplete="username" required autofocus>
      <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
      <label class="remember"><input type="checkbox" name="remember"> Запомнить меня</label>
      <button type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
