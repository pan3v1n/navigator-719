# Навигатор ПП РФ №719 — деплой одной VM: caddy (HTTPS, лендинг) + app (FastAPI+e5) + Qdrant.
# Порядок первого запуска — в docs/DEPLOY.md (индексация load_kb делается разово).
#
# Снаружи слушает ТОЛЬКО caddy (80/443). Он держит два имени: `PUBLIC_DOMAIN` → статический
# лендинг из ./landing, `APP_SUBDOMAIN.PUBLIC_DOMAIN` (сервис.…) → приложение. Сертификаты Let's Encrypt выпускает
# и продлевает сам (том caddy_data), для этого в security group VM должен быть открыт 443.
# `PUBLIC_DOMAIN` берётся из .env рядом с этим файлом (punycode!); без него — localhost с
# самоподписанным сертификатом, что годится для локальной проверки.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      APP_SUBDOMAIN: ${APP_SUBDOMAIN:-xn--b1afk4ade}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    # Порт наружу не публикуем — Qdrant доступен только приложению по внутренней сети.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - qdrant
    # DEEPSEEK_API_KEY, SESSION_SECRET, APP_VERSION и пр. — из .env на VM.
    env_file: .env
    environment:
      # APP_ENV=production включает startup-гард SESSION_SECRET: если секрет дефолтный — приложение
      # НЕ стартует (иначе можно подделать admin-cookie). Значит .env на VM ОБЯЗАН содержать
      # случайный SESSION_SECRET (docs/DEPLOY.md шаг 6).
      APP_ENV: production
      # Внутри compose-сети Qdrant доступен по имени сервиса.
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: pp719
      # БД приложения — в томе (переживает пересоздание контейнера).
      APP_DB_URL: sqlite:////data/navigator_app.db
      # Файловый лог loguru — на том appdata (переживает редеплой; ротация 10МБ / 14 дней).
      LOG_FILE: /data/app.log
      # Кэш модели e5 — в томе (качается один раз при первом load_kb).
      HF_HOME: /models
      SENTENCE_TRANSFORMERS_HOME: /models
      # Зеркало HF — раскомментируй в .env, если CDN huggingface рвётся с VM:
      # HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - models:/models
      - appdata:/data
    ports:
      # ТОЛЬКО петля VM: для скрипта выкатки и проверок с самой машины (curl 127.0.0.1:8000).
      # Наружу приложение не торчит — публичный вход через caddy. Раньше здесь было "80:8000".
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }  # ограничить docker-логи, чтобы не распухли за тест

volumes:
  qdrant_storage:
  models:
  appdata:
  caddy_data:    # сертификаты и ключи ACME — терять нельзя (лимиты выпуска Let's Encrypt)
  caddy_config:
