# Манифест корпуса — единственный источник правды о его составе (K8, issue #39).
#
# ЗАЧЕМ. До манифеста состав корпуса жил в трёх местах сразу: списком путей в `load_rules_kb.py`,
# значениями `doc_type` в коде и решением «эти Правила не индексируем», которое не было записано
# нигде. Утратившие силу «Правила выдачи заключения» исключались вручную — и почему, знал только
# тот, кто исключал. Здесь это решение записано, и загрузчик его исполняет.
#
# КАК ЧИТАТЬ. Одна запись = один документ корпуса. Поля паспорта уезжают в payload КАЖДОГО пункта
# этого документа, поэтому ответ может сослаться на юридическую силу и статус, а не только на
# текст. Пункты добавляются и исчезают при переиндексации — паспорт живёт здесь.
#
# ⚠ ЧЕГО ЗДЕСЬ НЕТ. Редакция (`edition`) НЕ проставляется руками: её вычисляет `detect_edition`
# из текста документа. В манифесте лежит `edition_expected` — то, что мы ожидаем увидеть; при
# расхождении загрузчик кричит. Так отставание корпуса от действующей редакции (задача A6)
# становится видно на загрузке, а не через полгода в отзыве пользователя.
#
# ⚠ `doc_type` — ИДЕНТИФИКАТОР документа, а не категория. По нему уже маршрутизирует K10 и стоит
# индекс в Qdrant; переименовывать его в угоду красоте паспорта дороже пользы. Категория
# документа («процедура», «критерии», …) лежит отдельно, в `doc_kind`.

version: 1

# ⚠ ЧТО ОПИСАНО. Все три коллекции сервиса. У каждого документа есть `collection` — без неё
# загрузчик процедурного корпуса попытался бы разобрать товарное приложение парсером норм.
scope: [pp719_rules, pp719, verified_cases]

# Словари допустимых значений — проверяются тестом. Новое значение добавляется СЮДА осознанно,
# а не расползается опечатками по записям.
vocabularies:
  authority:   [Правительство РФ, ТПП РФ, Минпромторг, ЕЭК, СНГ]
  legal_force: [1, 2, 3, 4, 5]   # 1 постановление · 2 правила/приложение · 3 ведомственный акт
                                 # 4 разъяснение · 5 практика
  doc_kind:    [критерии, процедура, состав документов, классификация, определения]
  topic:       [реестр, документы, СТ-1, акт, ГИСП, компоненты, продукция]
  key_type:    [ОКПД2, ТН ВЭД, null]
  status:      [действует, утратил силу, не вступил]
  collection:  [pp719, pp719_rules, verified_cases]

documents:

  - doc_type: decree_body
    collection: pp719_rules
    title: Постановление Правительства РФ «О подтверждении производства российской промышленной продукции»
    short: Тело ПП №719
    authority: Правительство РФ
    legal_force: 1
    doc_kind: критерии
    topic: продукция
    key_type: ОКПД2
    adopted: "2015-07-17"          # от 17 июля 2015 г. N 719
    valid_from: "2015-07-17"
    valid_to: null
    status: действует
    supersedes: null
    edition_expected: "ред. от 22.07.2026 N 923"
    sources:
      - pp719/chunks/01_postanovlenie.txt
    # Критерии подтверждения (п. 1 «а»–«г»), включая путь через СТ-1 для продукции,
    # которой нет в приложении. Самая цитируемая часть корпуса на процедурных вопросах.

  - doc_type: rules_registry
    collection: pp719_rules
    title: Правила формирования и ведения реестра российской промышленной продукции
    short: Правила ведения реестра
    authority: Правительство РФ
    legal_force: 2
    doc_kind: процедура
    topic: реестр
    key_type: null
    adopted: "2015-07-17"          # УТВЕРЖДЕНЫ постановлением Правительства РФ от 17.07.2015 N 719
    valid_from: "2015-07-17"
    valid_to: null
    status: действует
    supersedes: pravila_vydachi_zaklyucheniya
    edition_expected: "ред. от 13.04.2026 N 400"
    sources:
      - pp719/chunks/11_I_obshchie_polozheniya.txt
      - pp719/chunks/12_II_vklyuchenie_svedeniy.txt
      # ⚠ Файл несёт ДВА раздела — III и IV (issue #105). Раздел берётся из заголовка внутри
      # тела, а не из имени файла: иначе 13 пунктов подписываются чужим разделом.
      - pp719/chunks/13_III_vnesenie_izmeneniy.txt
      - pp719/chunks/14_V_predostavlenie_svedeniy.txt
      - pp719/chunks/15_VI_katalog_produkcii.txt

  - doc_type: tpp_order_52
    collection: pp719_rules
    title: Положение о порядке выдачи документов для целей подтверждения производства промышленной продукции на территории РФ
    short: Приказ ТПП РФ №52
    authority: ТПП РФ
    legal_force: 3
    doc_kind: состав документов
    topic: документы
    key_type: null
    adopted: "2018-05-30"          # Приказ ТПП РФ от 30 мая 2018 г. N 52
    valid_from: "2018-05-30"
    valid_to: null
    status: действует
    supersedes: null
    edition_expected: "ред. от 29.10.2025 N 70"
    sources:
      - pp719/prikaz52_tpp_full.txt

  - doc_type: appendix_footnotes
    collection: pp719_rules
    title: Сноски к приложению постановления Правительства РФ №719
    short: Сноски приложения
    authority: Правительство РФ
    legal_force: 2
    doc_kind: определения
    topic: продукция
    key_type: ОКПД2
    adopted: "2015-07-17"
    valid_from: "2015-07-17"
    valid_to: null
    status: действует
    supersedes: null
    edition_expected: "ред. от 22.07.2026 N 923"
    sources:
      - pp719/chunks/131_SNOSKI_prilozheniya.txt
    # Ссылок на сноски в требованиях сотни, а до D3 их определения не были доступны поиску вовсе.

  # ⚠ ДОКУМЕНТ, КОТОРЫЙ НЕ ИНДЕКСИРУЕТСЯ, И ПРИЧИНА — ЗДЕСЬ, А НЕ В ЧЬЕЙ-ТО ПАМЯТИ.
  # Ровно ради этой записи K8 и заводилась: раньше исключение было «решением не индексировать»,
  # не записанным нигде, и проверить его было нечем.
  - doc_type: pravila_vydachi_zaklyucheniya
    collection: pp719_rules
    title: Правила выдачи заключения о подтверждении производства промышленной продукции на территории РФ
    short: Правила выдачи заключения (утратили силу)
    authority: Правительство РФ
    legal_force: 2
    doc_kind: процедура
    topic: документы
    key_type: null
    adopted: "2015-07-17"
    valid_from: "2015-07-17"
    valid_to: "2024-06-29"         # «Утратили силу. (в ред. Постановления Правительства РФ от 29.06.2024 N 894)»
    status: утратил силу
    supersedes: null
    edition_expected: null
    sources: []                    # текста в корпусе нет — остался только заголовок в pp719_full.txt

  # --- Товарный корпус: приложение к постановлению (коллекция pp719) --------------------------
  - doc_type: pp719_appendix
    collection: pp719
    title: Приложение к постановлению Правительства РФ №719 — требования к промышленной продукции
    short: Приложение ПП №719
    authority: Правительство РФ
    legal_force: 2
    doc_kind: критерии
    topic: продукция
    key_type: ОКПД2
    adopted: "2015-07-17"
    valid_from: "2015-07-17"
    valid_to: null
    status: действует
    supersedes: null
    edition_expected: "ред. от 22.07.2026 N 923"
    # ⚠ ШАБЛОН, А НЕ СПИСОК ИЗ 29 ИМЁН — осознанно. Файлы разделов ГЕНЕРИРУЮТСЯ
    # (`structure_kb.py`), и перечисление завело бы второй список, расходящийся с каталогом
    # молча. У процедурного корпуса наоборот: пять разнородных файлов перечислены поимённо,
    # потому что подстановка `1[1-5]*.txt` однажды уже цепляла товарные чанки.
    sources:
      - pp719/structured/*.json

  # --- Кейсы эксперта ТПП (коллекция verified_cases) -----------------------------------------
  - doc_type: verified_cases
    collection: verified_cases
    title: Проверенные экспертом случаи — петля обучения
    short: Кейсы эксперта ТПП
    authority: ТПП РФ
    legal_force: 5              # практика, а НЕ норма: кейс уточняет применение, но не заменяет акт
    doc_kind: классификация
    topic: продукция
    key_type: ОКПД2
    adopted: null
    valid_from: null
    valid_to: null
    status: действует
    supersedes: null
    edition_expected: null      # у кейсов нет редакции: они не нормативный акт
    sources:
      - cases/*.json
    # Решение «файлы с префиксом `_` — шаблоны, в индекс не идут» жило условием внутри
    # `seed_cases.py`. Здесь оно видно тому, кто читает состав корпуса, а не только тому,
    # кто открыл загрузчик.
    exclude:
      - "_*.json"
