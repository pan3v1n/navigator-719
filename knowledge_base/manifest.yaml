  # ⚠ ДОКУМЕНТ, КОТОРЫЙ НЕ ИНДЕКСИРУЕТСЯ, И ПРИЧИНА — ЗДЕСЬ, А НЕ В ЧЬЕЙ-ТО ПАМЯТИ.
  # Ровно ради этой записи K8 и заводилась: раньше исключение было «решением не индексировать»,
  # не записанным нигде, и проверить его было нечем.

  - doc_type: metodrek_tpp
    collection: pp719_rules
    title: Методические рекомендации по подтверждению производства промышленной продукции на территории РФ
    short: Методрекомендации ТПП РФ
    authority: ТПП РФ
    legal_force: 4              # РАЗЪЯСНЕНИЕ, а не норма: помогает применять, но не создаёт обязанностей
    doc_kind: процедура
    topic: документы
    key_type: null
    adopted: null               # у методрекомендаций нет даты принятия — есть ВЕРСИЯ
    valid_from: null
    valid_to: null
    status: действует
    supersedes: null
    edition_expected: "Версия 1.18.3"
    sources:
      - pp719/metodrek_tpp_full.txt
    # ⚠⚠ ДОКУМЕНТ ДЕЙСТВУЮЩИЙ, НО ДВА ЕГО ФРАГМЕНТА ОПИСЫВАЮТ ОТМЕНЁННЫЙ ШАГ.
    # Вводная и схема процесса ведут заявителя за «заключением Минпромторга», а «Правила выдачи
    # заключения о подтверждении производства» УТРАТИЛИ СИЛУ 29.06.2024 (ПП РФ N 894) и заменены
    # Правилами ведения реестра — см. запись pravila_vydachi_zaklyucheniya и её supersedes.
    # Проверено по корпусу 25.08.2026: шага «заключение Минпромторга о подтверждении производства»
    # в действующих Правилах НЕТ вовсе; «экспертное заключение» там — другой инструмент (итог
    # выездной проверки, основание ИСКЛЮЧИТЬ реестровую запись, п. 36-40).
    # ⚠ Почему не хватило legal_force: 4. Сила источника решает КОНФЛИКТ НОРМ, а не УСТАРЕВАНИЕ.
    # Разъяснение, ведущее за отменённым документом, не «слабее» — оно просто неверно, и поле
    # «действует, но частично устарел» в паспорте отсутствует. Решение владельца 25.08.2026:
    # индексировать документ, исключив устаревшие фрагменты.
    # ⚠ Границы правил проверяются НА ЗАГРУЗКЕ: несовпавшее правило останавливает её (иначе текст
    # переиздали бы, чистка ослепла, и отменённая норма вернулась бы в индекс молча).
    exclude_fragments:
      - from: "Основанием для внесения в Реестр промышленной продукции, произведенной на территории"
        to: "документов <**>:"
        reason: "вводная: основанием названо заключение Минпромторга (Правила выдачи утратили силу)"
        since: "2024-06-29"
      - from: "Получите заключение Минпромторга России"
        to: "использованием сервиса ГИСП."
        reason: "схема процесса, шаг 2: получение заключения Минпромторга"
        since: "2024-06-29"

