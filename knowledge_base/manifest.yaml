# Манифест корпуса — единственный источник правды о его составе (K8, issue #39).
#
# ЗАЧЕМ. До манифеста состав корпуса жил в трёх местах сразу: списком путей в `load_rules_kb.py`,
# значениями `doc_type` в коде и решением «эти Правила не индексируем», которое не было записано
# нигде. Утратившие силу «Правила выдачи заключения» исключались вручную — и почему, знал только
# тот, кто исключал. Здесь это решение записано, и загрузчик его исполняет.
#
# КАК ЧИТАТЬ. Одна запись = один документ корпуса. Поля паспорта уезжают в payload КАЖДОГО пункта
# этого документа, поэтому ответ может сослаться на юридическую силу и статус, а не только на
# текст. Пункты добавляются и исчезают при переиндексации — паспорт живёт здесь.
#
# ⚠ ЧЕГО ЗДЕСЬ НЕТ. Редакция (`edition`) НЕ проставляется руками: её вычисляет `detect_edition`
# из текста документа. В манифесте лежит `edition_expected` — то, что мы ожидаем увидеть; при
# расхождении загрузчик кричит. Так отставание корпуса от действующей редакции (задача A6)
# становится видно на загрузке, а не через полгода в отзыве пользователя.
#
# ⚠ `doc_type` — ИДЕНТИФИКАТОР документа, а не категория. По нему уже маршрутизирует K10 и стоит
# индекс в Qdrant; переименовывать его в угоду красоте паспорта дороже пользы. Категория
# документа («процедура», «критерии», …) лежит отдельно, в `doc_kind`.

version: 1

# ⚠ ЧТО ОПИСАНО. Все три коллекции сервиса. У каждого документа есть `collection` — без неё
# загрузчик процедурного корпуса попытался бы разобрать товарное приложение парсером норм.
scope: [pp719_rules, pp719, verified_cases]

# Словари допустимых значений — проверяются тестом. Новое значение добавляется СЮДА осознанно,
# а не расползается опечатками по записям.
vocabularies:
  authority:   [Правительство РФ, ТПП РФ, Минпромторг, ЕЭК, СНГ]
  legal_force: [0, 1, 2, 3, 4, 5]  # 0 международный договор · 1 постановление
                                   # 2 правила/приложение · 3 ведомственный акт
                                   # 4 разъяснение · 5 практика
  doc_kind:    [критерии, процедура, состав документов, классификация, определения]
  topic:       [реестр, документы, СТ-1, акт, ГИСП, компоненты, продукция]
  key_type:    [ОКПД2, ТН ВЭД, null]
  status:      [действует, утратил силу, не вступил]
  collection:  [pp719, pp719_rules, verified_cases]

